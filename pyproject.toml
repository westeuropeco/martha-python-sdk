[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "martha-python-sdk"
version = "0.1.4"
description = "Python client for the Martha host API — collections, documents, workflow execution, approvals. Used by plugin BFFs, pipelines, and scripts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "UNLICENSED" }
authors = [{ name = "westeuropeco" }]
# Core client has ZERO runtime deps (stdlib urllib) so any Python service can
# install it cheaply. FastAPI is only needed for the optional plugin glue.
dependencies = []

[project.optional-dependencies]
fastapi = ["fastapi>=0.104"]
dev = ["pytest>=7.4", "fastapi>=0.104", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/westeuropeco/martha-python-sdk"

[tool.setuptools.packages.find]
include = ["martha_sdk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
